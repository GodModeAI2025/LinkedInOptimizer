name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Die Untergrenze Pillow>=10.1 und ihre Begruendung stehen in
      # requirements.txt. Hier wird dieselbe Datei installiert, die auch im
      # Skill-Paket liegt, damit die CI genau das prueft, was Anwender bekommen.
      - name: Abhaengigkeiten installieren
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      # PYTHONPYCACHEPREFIX haelt __pycache__ aus dem Arbeitsbaum,
      # das Repo hat keine .gitignore.
      - name: Python-Syntax pruefen
        run: PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python -m compileall -q scripts

      - name: Node-Syntax pruefen
        run: node --check scripts/generate_report.js

      - name: Banner ohne Verletzung endet mit 0
        run: |
          python scripts/create_banner.py \
            --output "$RUNNER_TEMP/banner-clean.png" \
            --title1 "Safe Zone" \
            --title2 "CI Smoke Test" \
            --subtitle "Kurzer Untertitel" \
            --role "Beispielrolle @ Beispiel GmbH" \
            --tags "#CI #SafeZone" \
            --strict

      - name: Banner mit Verletzung endet ungleich 0
        run: |
          rc=0
          python scripts/create_banner.py \
            --output "$RUNNER_TEMP/banner-broken.png" \
            --title1 "Ein viel zu langer Titel der die Safe Zone garantiert nach rechts verlaesst" \
            --strict 2> "$RUNNER_TEMP/banner-broken.err" || rc=$?
          cat "$RUNNER_TEMP/banner-broken.err"
          if [ "$rc" -eq 0 ]; then
            echo "FEHLER: --strict hat die Safe-Zone-Verletzung nicht gemeldet" >&2
            exit 1
          fi
          grep -q "Safe-Zone-Verletzung" "$RUNNER_TEMP/banner-broken.err"

      - name: Versionsangaben pruefen
        run: python scripts/check_versions.py

      # Ein kaputtes Paket soll auffallen, bevor jemand ein Tag setzt. Der
      # Schritt ruft dasselbe Skript auf wie release.yml und prueft danach das
      # Ergebnis, unabhaengig davon, was das Skript selbst zusichert.
      - name: Skill-Paket bauen und pruefen
        run: |
          name="$(python scripts/build_skill_package.py --print-name)"

          # Der Dateiname ist Teil des dokumentierten Downloads. Weicht er ab,
          # zeigt die Anleitung nach dem ersten Tag auf eine URL, die 404 liefert.
          url="https://github.com/GodModeAI2025/LinkedInOptimizer/releases/latest/download/$name"
          for datei in README.md index.html; do
            if ! grep -qF "$url" "$datei"; then
              echo "FEHLER: $datei nennt nicht die Download-URL $url" >&2
              exit 1
            fi
          done

          python scripts/build_skill_package.py "$RUNNER_TEMP/paket-a/$name"
          python scripts/build_skill_package.py "$RUNNER_TEMP/paket-b/$name"
          paket="$RUNNER_TEMP/paket-a/$name"

          # Zwei Laeufe hintereinander muessen dieselben Bytes liefern.
          cmp "$paket" "$RUNNER_TEMP/paket-b/$name"

          # Vorhanden, nicht leer, lesbares ZIP.
          test -s "$paket"
          python -c "import sys, zipfile; sys.exit(0 if zipfile.is_zipfile(sys.argv[1]) and zipfile.ZipFile(sys.argv[1]).testzip() is None else 1)" "$paket"

          # Genau diese Eintraege, keine weiteren. Der Vergleich faellt in beide
          # Richtungen auf: fehlende Datei und ungewollte Zugabe.
          erwartet="$(printf '%s\n' \
            LICENSE \
            SKILL.md \
            references/BANNER.md \
            references/SCORING.md \
            references/TEMPLATES.md \
            requirements.txt \
            scripts/create_banner.py \
            scripts/generate_report.js | sort)"
          tatsaechlich="$(unzip -Z1 "$paket" | sort)"
          diff <(echo "$erwartet") <(echo "$tatsaechlich")

          # Dieselbe Regel noch einmal als Verbot, damit sichtbar bleibt, was
          # nie ins Paket gehoert: Repo-Innereien, Landingpage, Schluesseldateien.
          if unzip -Z1 "$paket" | grep -nE '(^|/)[.]git(/|$)|(^|/)[.]github(/|$)|(^|/)index[.]html$|(^|/)course[.]html$|__pycache__|[.]ruff_cache|[.]DS_Store|[.](pem|key|p12|env)$|id_rsa|check_versions[.]py|build_skill_package[.]py'; then
            echo "FEHLER: Das Paket enthaelt Dateien, die nicht ausgeliefert werden duerfen." >&2
            exit 1
          fi

          unzip -l "$paket"
