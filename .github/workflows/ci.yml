name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Die Untergrenze Pillow>=10.1 und ihre Begruendung stehen in
      # requirements.txt. Hier wird dieselbe Datei installiert, die auch im
      # Skill-Paket liegt, damit die CI genau das prueft, was Anwender bekommen.
      - name: Abhaengigkeiten installieren
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      # PYTHONPYCACHEPREFIX haelt __pycache__ aus dem Arbeitsbaum,
      # das Repo hat keine .gitignore.
      - name: Python-Syntax pruefen
        run: PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python -m compileall -q scripts

      - name: Node-Syntax pruefen
        run: node --check scripts/generate_report.js

      - name: Banner ohne Verletzung endet mit 0
        run: |
          python scripts/create_banner.py \
            --output "$RUNNER_TEMP/banner-clean.png" \
            --title1 "Safe Zone" \
            --title2 "CI Smoke Test" \
            --subtitle "Kurzer Untertitel" \
            --role "Beispielrolle @ Beispiel GmbH" \
            --tags "#CI #SafeZone" \
            --strict

      - name: Banner mit Verletzung endet ungleich 0
        run: |
          rc=0
          python scripts/create_banner.py \
            --output "$RUNNER_TEMP/banner-broken.png" \
            --title1 "Ein viel zu langer Titel der die Safe Zone garantiert nach rechts verlaesst" \
            --strict 2> "$RUNNER_TEMP/banner-broken.err" || rc=$?
          cat "$RUNNER_TEMP/banner-broken.err"
          if [ "$rc" -eq 0 ]; then
            echo "FEHLER: --strict hat die Safe-Zone-Verletzung nicht gemeldet" >&2
            exit 1
          fi
          grep -q "Safe-Zone-Verletzung" "$RUNNER_TEMP/banner-broken.err"

      - name: Versionsangaben pruefen
        run: python scripts/check_versions.py

      # Die description im Frontmatter entscheidet, ob das Modell diesen Skill
      # oder den Schwester-Skill linkedin-community-builder laedt. Geprueft
      # werden Laenge (hoechstens 400 Zeichen), Strichzeichen und die Frage, ob
      # der Abgrenzungssatz den anderen Skill beim Namen nennt. Faellt der Satz
      # bei einer Ueberarbeitung weg, kollidieren die Trigger wieder.
      - name: Trigger-Beschreibung pruefen
        run: python scripts/check_descriptions.py

      # Prueft references/SOURCES.md und haelt zugleich fest, dass keine der
      # dort als unbelegt entfernten Aussagen ueber eine spaetere Aenderung
      # zurueck in den Skill wandert. Die Sperren erzeugt das Skript aus der
      # Spalte "Sperrmuster" der Tabelle "Zurückgezogen", und es prueft die
      # Tabelle gegen sich selbst: eine Zeile ohne Sperrmuster faellt hier auf,
      # und eine Zeile, die ihre Sperre abschalten will, ebenfalls. Dazu kommt
      # eine Belegpflicht fuer die eine Behauptung, die sich nicht ueber eine
      # Schreibweise sperren laesst. Die Grenze steht im Docstring des Skripts:
      # geprueft werden Schreibweisen, keine Aussagen.
      - name: Beleglage pruefen
        run: python scripts/check_sources.py

      # Prueft die Scoring-Matrix gegen drei erfundene Profil-Fixtures und
      # haelt zugleich drei Listen zusammen: die zehn Kategorien heissen in
      # SCORING.md, im Skill-Text und in index.html und generate_report.js
      # und in der Audit-Tabelle des Report-Generators.
      # wortgleich, die 18 Profil-Elemente in derselben Reihenfolge in Phase 4.3
      # Report-Generators, die Stueckzahl stimmt zusaetzlich in der
      # Der Skill-Text ist seit v2.6.0 die Router-Datei SKILL.md plus die acht
      # Phasendateien; die Landingpage weist ihren Dialog als Beispiel
      # aus und nennt die Fixture, aus der seine Zahlen stammen.
      # Seit v2.5.0 kommen drei Bindungen dazu: die vier gesperrten
      # CTA-Formulierungen aus references/ETHICS.md stehen vollstaendig an allen
      # vier Stellen, die dieselbe Liste fuehren, und der Skill-Text verankert den
      # Ethik-Abgleich; die zehn Achsen der Wettbewerbsmatrix stehen in
      # references/COMPETITIVE.md und in Phase 3.1 in derselben
      # Reihenfolge, und die Mindestzahl der Wettbewerber lautet ueberall
      # gleich; der Massnahmenplan laeuft an allen vier Stellen ueber Tag 1-30,
      # 31-60 und 61-90, und die abgeloesten Horizonte duerfen nicht
      # danebenstehen. Alle drei pruefen Schreibweisen und Listen, kein
      # Verhalten; die Grenze steht in den beiden Referenzdateien jeweils im
      # letzten Abschnitt.
      - name: Eval-Set fahren
        run: python tests/run_eval.py

      # Ein kaputtes Paket soll auffallen, bevor jemand ein Tag setzt. Der
      # Schritt ruft dasselbe Skript auf wie release.yml und prueft danach das
      # Ergebnis, unabhaengig davon, was das Skript selbst zusichert.
      - name: Skill-Paket bauen und pruefen
        run: |
          name="$(python scripts/build_skill_package.py --print-name)"

          # Der Dateiname ist Teil des dokumentierten Downloads. Weicht er ab,
          # zeigt die Anleitung nach dem ersten Tag auf eine URL, die 404 liefert.
          url="https://github.com/GodModeAI2025/LinkedInOptimizer/releases/latest/download/$name"
          for datei in README.md index.html; do
            if ! grep -qF "$url" "$datei"; then
              echo "FEHLER: $datei nennt nicht die Download-URL $url" >&2
              exit 1
            fi
          done

          python scripts/build_skill_package.py "$RUNNER_TEMP/paket-a/$name"
          python scripts/build_skill_package.py "$RUNNER_TEMP/paket-b/$name"
          paket="$RUNNER_TEMP/paket-a/$name"

          # Zwei Laeufe hintereinander muessen dieselben Bytes liefern.
          cmp "$paket" "$RUNNER_TEMP/paket-b/$name"

          # Vorhanden, nicht leer, lesbares ZIP.
          test -s "$paket"
          python -c "import sys, zipfile; sys.exit(0 if zipfile.is_zipfile(sys.argv[1]) and zipfile.ZipFile(sys.argv[1]).testzip() is None else 1)" "$paket"

          # Genau diese Eintraege, keine weiteren. Der Vergleich faellt in beide
          # Richtungen auf: fehlende Datei und ungewollte Zugabe.
          erwartet="$(printf '%s\n' \
            CHANGELOG.md \
            LICENSE \
            SKILL.md \
            references/BANNER.md \
            references/COMPETITIVE.md \
            references/ETHICS.md \
            references/PHASE-1-discovery.md \
            references/PHASE-2-scoring.md \
            references/PHASE-3-wettbewerb.md \
            references/PHASE-4-profil.md \
            references/PHASE-5-banner.md \
            references/PHASE-6-content.md \
            references/PHASE-7-ssi.md \
            references/PHASE-8-report.md \
            references/SCORING.md \
            references/SOURCES.md \
            references/TEMPLATES.md \
            references/UNTRUSTED.md \
            requirements.txt \
            scripts/create_banner.py \
            scripts/generate_report.js | sort)"
          tatsaechlich="$(unzip -Z1 "$paket" | sort)"
          diff <(echo "$erwartet") <(echo "$tatsaechlich")

          # Wer nur das Paket hat, findet requirements.txt darin, aber ohne
          # diese Zeile nirgends den Weg dorthin. Der dokumentierte Aufruf
          # endet dann mit ModuleNotFoundError: No module named 'PIL'.
          if ! unzip -p "$paket" SKILL.md references/PHASE-5-banner.md | grep -qF "pip install -r requirements.txt"; then
            echo "FEHLER: Das Paket nennt pip install -r requirements.txt nirgends." >&2
            exit 1
          fi

          # Dieselbe Regel noch einmal als Verbot, damit sichtbar bleibt, was
          # nie ins Paket gehoert: Repo-Innereien, Landingpage, Schluesseldateien.
          if unzip -Z1 "$paket" | grep -nE '(^|/)[.]git(/|$)|(^|/)[.]github(/|$)|(^|/)[.]claude-plugin(/|$)|(^|/)index[.]html$|(^|/)course[.]html$|__pycache__|[.]ruff_cache|[.]DS_Store|[.](pem|key|p12|env)$|id_rsa|check_versions[.]py|check_sources[.]py|check_descriptions[.]py|build_skill_package[.]py'; then
            echo "FEHLER: Das Paket enthaelt Dateien, die nicht ausgeliefert werden duerfen." >&2
            exit 1
          fi

          unzip -l "$paket"
